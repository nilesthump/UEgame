name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      narrative: ${{ steps.filter.outputs.narrative }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          core=false
          narrative=false
          if [ "$EVENT_NAME" != "pull_request" ]; then
            core=true
            narrative=true
          else
            git fetch --no-tags origin "$BASE_REF"
            files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
            if printf '%s\n' "$files" | grep -Eq '^(Source/|Tests/|CMakeLists\.txt$|UEgame\.uproject$|Config/|Content/|Scripts/Validation/|spec/governance/validation\.json$|\.github/workflows/)'; then
              core=true
            fi
            if printf '%s\n' "$files" | grep -Eq '^(spec/contracts/narrative/|Scripts/Narrative/)'; then
              narrative=true
            fi
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "narrative=$narrative" >> "$GITHUB_OUTPUT"

  repository-baseline:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository baseline
        shell: pwsh
        run: pwsh -NoProfile -File Scripts/Validation/Invoke-RepositoryChecks.ps1

  narrative-text:
    needs: changes
    if: needs.changes.outputs.narrative == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check narrative text contract
        shell: pwsh
        run: pwsh -NoProfile -File Scripts/Validation/Test-NarrativeText.ps1

  core-linux:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reference CMake and CTest
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-remove -y cmake=3.28.3-1build7 cmake-data=3.28.3-1build7
          /usr/bin/cmake --version
          /usr/bin/ctest --version
      - name: Configure shared core
        run: /usr/bin/cmake -S . -B .build/core-linux-gcc13 -DCMAKE_CXX_COMPILER=/usr/bin/g++-13 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build shared core and self-contained headers
        run: /usr/bin/cmake --build .build/core-linux-gcc13 --verbose
      - name: Execute explicit core cases
        run: /usr/bin/ctest --test-dir .build/core-linux-gcc13 --no-tests=error --verbose --output-junit ctest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-linux-results
          path: .build/core-linux-gcc13/ctest-junit.xml
          if-no-files-found: error
