name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository baseline
        shell: pwsh
        run: pwsh -NoProfile -File Scripts/Validation/Invoke-RepositoryChecks.ps1
